name: offline_first_tasks
description: Práctica Guiada - Arquitectura Offline-First en Flutter (cierre Unidad II).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ── Persistencia local (Single Source of Truth) ─────────────────────────
  sqflite: ^2.4.1              # SQLite embebido: la UI SIEMPRE lee de aquí.
  path: ^1.9.0                 # join() para construir la ruta del archivo .db.

  # ── Red y segundo plano ─────────────────────────────────────────────────
  connectivity_plus: ^6.1.0    # Stream reactivo de cambios de conectividad.
  workmanager: ^0.10.6        # Tarea diferida (WorkManager/BGTask) con restricción de red.

  # ── Identidad e idempotencia ────────────────────────────────────────────
  uuid: ^4.5.1                 # UUID v4 generado en el CLIENTE => id idempotente hacia la API.
  flutter_secure_storage: ^9.2.4 # Keystore (Android) / Keychain (iOS): tokens cifrados en reposo.

  # ── Backend en la nube (mismo stack que las prácticas previas) ──────────
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0        # Identidad: el UID viaja firmado en el token.
  cloud_firestore: ^5.6.12     # Base remota; reglas validan request.auth.uid.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
